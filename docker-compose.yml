services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: antideepfake_dev
      POSTGRES_USER: antideepfake
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local Postgres password}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - postgres-data:/var/lib/postgresql/data
volumes:
  postgres-data:
